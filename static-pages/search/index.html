<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search articles — FastenerInsight</title>
<meta name="description" content="Search every FastenerInsight article on fastener standards, materials, coatings and procurement.">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://blog.fastenerinsight.com">
<style>
  :root{
    --ink:#111418; --ink2:#3d4750; --muted:#626d78; --line:#e4e8ec;
    --bg:#fff; --soft:#f6f8f9; --accent:#35526b; --accent2:#4d7690; --mark:#fff3b0;
    --radius:8px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .hdr{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:10}
  .hdr__in{max-width:820px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{font-weight:700;font-size:19px;letter-spacing:-.4px;color:var(--ink)}
  .logo span{color:var(--accent)}
  .hdr__nav{display:flex;gap:22px;font-size:14px;font-weight:500}
  .hdr__nav a{color:var(--ink2)}

  main{max-width:820px;margin:0 auto;padding:44px 24px 80px}
  h1{font-size:30px;letter-spacing:-.6px;margin:0 0 6px}
  .lede{color:var(--muted);margin:0 0 26px;font-size:16px}

  form.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;background:#fff;box-shadow:0 1px 2px rgba(17,20,24,.04);transition:border-color .2s,box-shadow .2s}
  form.search:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(77,118,144,.12)}
  form.search svg{flex:0 0 auto;color:var(--muted)}
  #q{flex:1;border:0;outline:0;font:inherit;font-size:17px;padding:12px 0;background:transparent;color:var(--ink);min-width:0}
  #q::-webkit-search-cancel-button{-webkit-appearance:none}
  form.search button{border:0;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:10px 20px;border-radius:999px;cursor:pointer}
  form.search button:hover{background:#2b435a}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
  .chips button{border:1px solid var(--line);background:var(--soft);color:var(--ink2);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
  .chips button:hover{border-color:var(--accent2);color:var(--accent)}
  .chips .lbl{font-size:13px;color:var(--muted);align-self:center;margin-right:2px}

  .meta{font-size:14px;color:var(--muted);margin:26px 0 10px;min-height:20px}

  ol.results{list-style:none;margin:0;padding:0}
  ol.results li{border-top:1px solid var(--line);padding:20px 0}
  ol.results li:first-child{border-top:0}
  ol.results h2{font-size:19px;line-height:1.35;margin:0 0 6px;letter-spacing:-.2px}
  ol.results h2 a{color:var(--ink)}
  ol.results h2 a:hover{color:var(--accent);text-decoration:none}
  ol.results p{margin:0 0 8px;color:var(--ink2);font-size:15px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
  .tag{text-transform:uppercase;letter-spacing:.6px;font-weight:600;color:var(--accent);background:rgba(53,82,107,.08);padding:2px 8px;border-radius:4px;font-size:11.5px}
  mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
  .empty{padding:34px 0;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px;text-align:center}
  @media (max-width:560px){
    h1{font-size:24px}
    form.search button{padding:10px 14px}
    .hdr__nav a:first-child{display:none}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr__in">
    <a class="logo" href="https://blog.fastenerinsight.com/">Fastener<span>Insight</span></a>
    <nav class="hdr__nav">
      <a href="https://blog.fastenerinsight.com/">All articles</a>
      <a href="https://blog.fastenerinsight.com/tag/standards/">Standards</a>
      <a href="https://fastenerinsight.com/">Main site</a>
    </nav>
  </div>
</header>

<main>
  <h1>Search articles</h1>
  <p class="lede">Standards, materials, coatings, procurement — full-text search across every published article.</p>

  <form class="search" id="searchForm" role="search" action="/search/" method="get">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
    <label class="sr" for="q">Search articles</label>
    <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="e.g. EN 3.1 certificates, ISO 898, zinc flake">
    <button type="submit">Search</button>
  </form>

  <div class="chips" id="chips"></div>
  <div class="meta" id="meta" role="status" aria-live="polite"></div>
  <ol class="results" id="results"></ol>
</main>

<footer>Fastener Insight — engineering specifications meet procurement reality.</footer>

<script>
(function () {
  'use strict';

  var API_KEY = 'a6fb75a940c0d707b31491aa62';
  var API = 'https://blog.fastenerinsight.com/ghost/api/content/posts/?key=' + API_KEY +
            '&limit=all&include=tags&fields=title,url,excerpt,plaintext,published_at,reading_time';
  var SUGGESTIONS = ['EN 3.1 certificates', 'EN 10204', 'ISO 898', 'stainless steel', 'zinc flake', 'torque', 'traceability', 'MIL-spec'];

  var input = document.getElementById('q');
  var resultsEl = document.getElementById('results');
  var metaEl = document.getElementById('meta');
  var chipsEl = document.getElementById('chips');
  var form = document.getElementById('searchForm');

  var posts = null;
  var ready = false;
  var timer = null;

  /* ---------- text helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function normDots(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9.+\/-]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function words(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
  }
  function stemKey(w) { return w.length <= 3 ? w : w.slice(0, 4); }
  function rxEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function stripTags(html) {
    return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  /* ---------- index ---------- */
  function prep(p) {
    var tagNames = (p.tags || []).map(function (t) { return t.name; }).join(' ');
    var body = p.plaintext || stripTags(p.excerpt);
    var o = {
      title: p.title,
      url: p.url,
      excerpt: stripTags(p.excerpt),
      body: body,
      published: p.published_at,
      read: p.reading_time,
      tag: (p.tags && p.tags[0]) ? p.tags[0].name : '',
      tagText: tagNames
    };
    o.titleDots = normDots(p.title);
    o.titleKeys = {};
    words(p.title).forEach(function (w) { o.titleKeys[stemKey(w)] = 1; });
    o.tagDots = normDots(tagNames);
    o.tagKeys = {};
    words(tagNames).forEach(function (w) { o.tagKeys[stemKey(w)] = 1; });
    o.bodyDots = normDots(body);
    o.bodyKeys = {};
    o.bodyCounts = {};
    words(body).forEach(function (w) {
      var k = stemKey(w);
      o.bodyKeys[k] = 1;
      o.bodyCounts[k] = (o.bodyCounts[k] || 0) + 1;
    });
    return o;
  }

  function loadIndex(cb) {
    var cached = null;
    try {
      cached = JSON.parse(sessionStorage.getItem('fi_search_index_v1') || 'null');
    } catch (e) { cached = null; }

    function fromData(data) {
      posts = data.map(prep);
      ready = true;
      cb();
    }
    if (cached && cached.at && (Date.now() - cached.at) < 15 * 60 * 1000 && cached.posts && cached.posts.length) {
      fromData(cached.posts);
      return;
    }
    fetch(API, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = (d.posts || []);
        try {
          sessionStorage.setItem('fi_search_index_v1', JSON.stringify({ at: Date.now(), posts: list }));
        } catch (e) { /* quota — ignore */ }
        fromData(list);
      })
      .catch(function () {
        metaEl.textContent = 'Search index could not be loaded. Please retry.';
      });
  }

  /* ---------- query ---------- */
  function parseQuery(q) {
    return q.trim().toLowerCase().split(/\s+/).filter(Boolean).map(function (t) {
      var cleaned = t.replace(/^[^a-z0-9.+\/-]+|[^a-z0-9.+\/-]+$/g, '');
      if (!cleaned) return null;
      if (/^[a-z]+$/.test(cleaned)) return { raw: cleaned, type: 'word', k: stemKey(cleaned) };
      return { raw: cleaned, type: 'str' };
    }).filter(Boolean);
  }

  function matchWeight(p, t) {
    if (t.type === 'word') {
      if (p.titleKeys[t.k]) return 16;
      if (p.tagKeys[t.k]) return 9;
      if (p.bodyKeys[t.k]) return 4;
      return 0;
    }
    if (p.titleDots.indexOf(t.raw) >= 0) return 16;
    if (p.tagDots.indexOf(t.raw) >= 0) return 9;
    if (p.bodyDots.indexOf(t.raw) >= 0) return 4;
    return 0;
  }

  function tf(p, t) {
    if (t.type === 'word') return p.bodyCounts[t.k] || 0;
    var i = 0, n = 0;
    while ((i = p.bodyDots.indexOf(t.raw, i)) >= 0) { n++; i += t.raw.length; }
    return n;
  }

  function score(p, terms, phrase, idf) {
    var total = 0, hits = 0;
    for (var i = 0; i < terms.length; i++) {
      var m = matchWeight(p, terms[i]);
      if (m > 0) {
        hits++;
        total += m * idf[i] + Math.min(14, tf(p, terms[i])) * 1.5;
      }
    }
    if (!hits) return { score: 0, hits: 0 };
    if (phrase) {
      if (p.titleDots.indexOf(phrase) >= 0) total += 24;
      else if (p.tagDots.indexOf(phrase) >= 0) total += 12;
      else if (p.bodyDots.indexOf(phrase) >= 0) total += 8;
    }
    return { score: total, hits: hits };
  }

  function highlight(text, terms) {
    var out = esc(text);
    terms.forEach(function (t) {
      var pat = t.type === 'word'
        ? '\\b' + rxEsc(t.raw) + '[a-z0-9]*'
        : rxEsc(t.raw);
      try {
        out = out.replace(new RegExp(pat, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
      } catch (e) { /* invalid pattern — skip */ }
    });
    return out;
  }

  function snippet(p, terms) {
    var body = p.body || p.excerpt || '';
    var lower = body.toLowerCase();
    var idx = -1;
    for (var i = 0; i < terms.length; i++) {
      var i2 = lower.indexOf(terms[i].raw);
      if (i2 >= 0 && (idx < 0 || i2 < idx)) idx = i2;
    }
    if (idx < 0) idx = 0;
    var start = Math.max(0, idx - 100);
    var end = Math.min(body.length, idx + 190);
    if (start > 0) {
      var sp = body.indexOf(' ', start);
      if (sp > start && sp < idx) start = sp + 1;
    }
    if (end < body.length) {
      var ep = body.lastIndexOf(' ', end);
      if (ep > idx) end = ep;
    }
    var text = body.slice(start, end).trim();
    return (start > 0 ? '… ' : '') + highlight(text, terms) + (end < body.length ? ' …' : '');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
  }

  /* ---------- render ---------- */
  function renderChips(show) {
    if (!show) { chipsEl.innerHTML = ''; return; }
    chipsEl.innerHTML = '<span class="lbl">Try:</span>' + SUGGESTIONS.map(function (s) {
      return '<button type="button" data-q="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');
  }

  function run() {
    var q = input.value.trim();
    if (!q) {
      metaEl.textContent = '';
      resultsEl.innerHTML = '';
      renderChips(true);
      return;
    }
    renderChips(false);
    if (!ready) { metaEl.textContent = 'Loading search index…'; return; }

    var terms = parseQuery(q);
    if (!terms.length) { metaEl.textContent = 'Type a word to search.'; resultsEl.innerHTML = ''; return; }

    var phrase = normDots(q);

    // inverse document frequency: rare words (e.g. "certificates") outweigh common ones (e.g. "en")
    var idf = terms.map(function (t) {
      var df = 0;
      for (var j = 0; j < posts.length; j++) if (matchWeight(posts[j], t) > 0) df++;
      return Math.log((posts.length + 1) / (df + 1)) + 1;
    });

    var scored = [];
    for (var i = 0; i < posts.length; i++) {
      var s = score(posts[i], terms, phrase, idf);
      if (s.score > 0) scored.push({ p: posts[i], s: s.score, hits: s.hits });
    }

    var all = terms.length;
    var strict = scored.filter(function (x) { return x.hits === all; });
    var near = all > 1 ? scored.filter(function (x) { return x.hits >= all - 1; }) : [];

    var list, note = '';
    if (strict.length) {
      list = strict;
    } else if (near.length) {
      // allow one missing word so a near-miss never dead-ends, but never fall back to noise
      near.sort(function (a, b) {
        if (b.hits !== a.hits) return b.hits - a.hits;
        return b.s - a.s;
      });
      list = near;
      note = 'no article contains every word — showing the closest matches';
    } else {
      list = [];
    }

    list.sort(function (a, b) { return b.s - a.s; });
    list = list.slice(0, 40);

    if (!list.length) {
      metaEl.textContent = 'No articles match “' + q + '”.';
      resultsEl.innerHTML = '<li class="empty">Nothing found. Try a standard number (ISO 898, EN 10204, ASTM A325), ' +
        'a material (316, 1.4301, class 8.8) or a process (zinc flake, torque, traceability).</li>';
      renderChips(true);
      return;
    }

    metaEl.textContent = list.length + (list.length === 1 ? ' article matches ' : ' articles match ') + '“' + q + '”' + (note ? ' — ' + note : '');

    resultsEl.innerHTML = list.map(function (x) {
      var p = x.p;
      return '<li>' +
        '<h2><a href="' + esc(p.url) + '">' + highlight(p.title, terms) + '</a></h2>' +
        '<p>' + snippet(p, terms) + '</p>' +
        '<div class="row">' +
          (p.tag ? '<span class="tag">' + esc(p.tag) + '</span>' : '') +
          (p.published ? '<span>' + esc(fmtDate(p.published)) + '</span>' : '') +
          (p.read ? '<span>' + esc(p.read) + ' min read</span>' : '') +
        '</div>' +
      '</li>';
    }).join('');
  }

  /* ---------- wiring ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    var url = q ? ('/search/?q=' + encodeURIComponent(q)) : '/search/';
    history.replaceState(null, '', url);
    run();
  });

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var q = input.value.trim();
      history.replaceState(null, '', q ? ('/search/?q=' + encodeURIComponent(q)) : '/search/');
      run();
    }, 160);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { input.value = ''; run(); }
  });

  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-q]');
    if (!b) return;
    input.value = b.getAttribute('data-q');
    input.focus();
    clearTimeout(timer);
    history.replaceState(null, '', '/search/?q=' + encodeURIComponent(input.value));
    run();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input) {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      e.preventDefault();
      input.focus();
      input.select();
    }
  });

  var start = new URLSearchParams(location.search).get('q') || '';
  if (start) input.value = start;
  renderChips(!start);
  loadIndex(run);
})();
</script>
</body>
</html>
